---
- name: Install Bun prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - unzip
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Check whether Bun is already installed
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.bun/bin/bun"
  register: bun_binary

- name: Install Bun for workstation user
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://bun.sh/install | bash
  args:
    executable: /bin/bash
    creates: "{{ workstation_home }}/.bun/bin/bun"
  environment:
    HOME: "{{ workstation_home }}"
  become: true
  become_user: "{{ workstation_user }}"
  when: not bun_binary.stat.exists

- name: Add Bun environment variables to Zsh
  ansible.builtin.blockinfile:
    path: "{{ workstation_home }}/.zshrc"
    create: true
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BUN"
    block: |
      export BUN_INSTALL="$HOME/.bun"
      export PATH="$BUN_INSTALL/bin:$PATH"
  become: true

- name: Get installed Bun version
  ansible.builtin.command:
    cmd: "{{ workstation_home }}/.bun/bin/bun --version"
  register: bun_version
  changed_when: false
  become: true
  become_user: "{{ workstation_user }}"

- name: Display Bun version
  ansible.builtin.debug:
    msg: "Bun version: {{ bun_version.stdout }}"
