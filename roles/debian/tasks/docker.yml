---
- name: Install prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository to Apt sources
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt cache after adding repository
  apt:
    update_cache: true

- name: Download Docker Desktop
  get_url:
    url: "https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb"
    dest: "/var/tmp/docker-desktop-amd64.deb"
    mode: "0644"
  tags:
    - docker

- name: Install Docker Desktop
  apt:
    deb: "/var/tmp/docker-desktop-amd64.deb"
    state: present
  tags:
    - docker

- name: Delete Docker Desktop Download
  file:
    path: "/var/tmp/docker-desktop-amd64.deb"
    state: absent
  tags:
    - docker

- name: Add user to docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes
  tags:
    - docker
