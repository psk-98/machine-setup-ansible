---
- name: Install mise apt repo helper
  become: true
  ansible.builtin.apt:
    name:
      - extrepo
      - ca-certificates
    state: present
    update_cache: true

- name: Enable mise apt repository
  become: true
  ansible.builtin.command: extrepo enable mise
  args:
    creates: /etc/apt/sources.list.d/extrepo_mise.sources

- name: Update apt cache after adding mise repo
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install mise
  become: true
  ansible.builtin.apt:
    name: mise
    state: present

- name: Add mise activation to zsh
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(mise activate zsh)"'
    create: true
    mode: "0644"

- name: Check mise version
  ansible.builtin.command: mise --version
  register: mise_version
  changed_when: false

- name: Show mise version
  ansible.builtin.debug:
    var: mise_version.stdout
