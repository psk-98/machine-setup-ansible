---
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Generate SSH key if missing
  ansible.builtin.command: >
    ssh-keygen -t ed25519
    -C "{{ ansible_user_id }}@{{ ansible_hostname }}"
    -f "{{ ansible_env.HOME }}/.ssh/id_ed25519"
    -N ""
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_ed25519"

- name: Generate RSA SSH key if missing
  ansible.builtin.command: >
    ssh-keygen -t rsa -b 4096
    -C "{{ ansible_user_id }}@{{ ansible_hostname }}"
    -f "{{ ansible_env.HOME }}/.ssh/id_rsa"
    -N ""
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_rsa"

- name: Ensure SSH config exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/config"
    state: touch
    mode: "0600"
