---
- name: Install font dependencies
  become: true
  ansible.builtin.apt:
    name:
      - fontconfig
      - unzip
    state: present
    update_cache: true

- name: Ensure local fonts directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/fonts/NerdFonts"
    state: directory
    mode: "0755"

- name: Download Nerd Font archives
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
    dest: "/tmp/{{ item }}.zip"
    mode: "0644"
  loop:
    - JetBrainsMono
    - FiraCode
    - Hack
    - Meslo

- name: Extract Nerd Fonts
  ansible.builtin.unarchive:
    src: "/tmp/{{ item }}.zip"
    dest: "{{ ansible_env.HOME }}/.local/share/fonts/NerdFonts"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.local/share/fonts/NerdFonts/{{ item }}"
  loop:
    - JetBrainsMono
    - FiraCode
    - Hack
    - Meslo

- name: Refresh font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: false
