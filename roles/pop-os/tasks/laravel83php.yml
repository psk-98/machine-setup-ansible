---
- name: Install PHP 8.3 for Laravel development
  apt:
    name:
      - php8.3-cli
      - php8.3-common
      - php8.3-curl
      - php8.3-mbstring
      - php8.3-xml
      - php8.3-zip
      - php8.3-bcmath
      - php8.3-intl
      - php8.3-sqlite3
      - php8.3-mysql
      - php8.3-pgsql
      - php8.3-gd
      - php8.3-readline
      - unzip
      - curl
      - git
    state: present
    update_cache: true

- name: Check PHP version
  ansible.builtin.command: php -v
  register: php_version
  changed_when: false

- name: Show PHP version
  ansible.builtin.debug:
    msg: "{{ php_version.stdout_lines }}"
